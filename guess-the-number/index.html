<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>Guess the Number — Sohail</title><style>:root{color-scheme:dark;--bg:#101113;--line:#303338;--fg:#f2f0eb;--muted:#999b98;--lime:#d7ff64;--mono:"DM Mono",monospace;--sans:Manrope,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#20251b,var(--bg) 65%);color:var(--fg);font-family:var(--sans);display:grid;place-items:center;padding:24px}.game{width:min(100%,510px);border:1px solid var(--line);background:#111315;padding:clamp(24px,6vw,44px);box-shadow:0 20px 90px #0006}.back{color:#b8b8b5;text-decoration:none;font:11px var(--mono)}.back:hover{color:var(--lime)}.eyebrow{margin:40px 0 12px;color:var(--lime);font:10px var(--mono);letter-spacing:.12em}h1{font-size:clamp(36px,9vw,54px);line-height:1.05;letter-spacing:-.06em;font-weight:600;margin:0}.lead{color:var(--muted);font-size:14px;line-height:1.8}.range{margin:25px 0;color:#c5c8bf;font:11px var(--mono)}form{display:flex;gap:9px;margin-top:25px}input,button{min-height:48px;border:1px solid var(--line);font:13px var(--mono)}input{flex:1;min-width:0;background:#17191a;color:var(--fg);padding:0 14px}input:focus{outline:1px solid var(--lime)}button{padding:0 18px;background:var(--lime);color:#171811;border:0;cursor:pointer;font-weight:600}.message{min-height:28px;margin:17px 0 0;color:#c9cbc4;font:12px var(--mono);line-height:1.6}.stats{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:24px;padding-top:17px;color:var(--muted);font:10px var(--mono)}.stats strong{color:var(--fg);font-weight:400}.restart{background:transparent;color:var(--fg);border:1px solid var(--line);min-height:37px;margin-top:22px;font-size:10px}.foot{margin-top:26px;font:10px var(--mono);color:#777a76}.foot a{color:#b8b8b5;text-decoration:none}</style></head><body><main class="game"><a class="back" href="/">← Back to portfolio</a><p class="eyebrow">A LITTLE PYTHON-INSPIRED CHALLENGE</p><h1>Guess the<br>number.</h1><p class="lead">I’m thinking of a number. Make a guess and I’ll tell you if it’s higher or lower.</p><p class="range">RANGE / 1 — 100</p><form id="form"><label hidden for="guess">Your guess</label><input id="guess" type="number" min="1" max="100" placeholder="Type a number…" required><button>GUESS ↗</button></form><p class="message" id="message" aria-live="polite">Ready when you are.</p><div class="stats"><span>ATTEMPTS <strong id="attempts">0</strong></span><span>BEST <strong id="best">—</strong></span></div><button class="restart" id="restart" type="button">START A NEW GAME</button><p class="foot">Built by Sohail · <a href="https://github.com/Sohail17224/my-portfolio/blob/main/guess-the-number/guess_the_number.py">View Python source ↗</a></p></main><script>const form=document.querySelector('#form'),input=document.querySelector('#guess'),msg=document.querySelector('#message'),ae=document.querySelector('#attempts'),be=document.querySelector('#best');let secret,n,done=false,best=Number(localStorage.getItem('guess-best')||0);be.textContent=best||'—';function reset(){secret=Math.floor(Math.random()*100)+1;n=0;done=false;ae.textContent=0;msg.textContent='Ready when you are.';input.value='';input.disabled=false;form.querySelector('button').disabled=false;input.focus()}form.onsubmit=e=>{e.preventDefault();const g=Number(input.value);if(!Number.isInteger(g)||g<1||g>100){msg.textContent='Enter a whole number from 1 to 100.';return}if(done)return;n++;ae.textContent=n;if(g===secret){done=true;msg.textContent='You got it in '+n+' '+(n===1?'guess':'guesses')+'! Nice work.';if(!best||n<best){best=n;localStorage.setItem('guess-best',best);be.textContent=best}input.disabled=true;form.querySelector('button').disabled=true}else{msg.textContent=g<secret?'Too low — try a higher number.':'Too high — try a lower number.';input.select()}};document.querySelector('#restart').onclick=reset;reset();</script></body></html>
